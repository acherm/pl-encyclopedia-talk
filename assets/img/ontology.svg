<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 615" font-family="'Latin Modern Sans', 'LM Sans 10', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="on-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5a5a6a"/>
    </marker>
    <marker id="on-aG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#007a00"/>
    </marker>
    <marker id="on-aR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c00000"/>
    </marker>
  </defs>

  <!-- ============ edges (drawn first, under the boxes) ============ -->
  <g stroke="#5a5a6a" stroke-width="2" fill="none">
    <!-- Source -> Language -->
    <path d="M302,105 L454,105" marker-end="url(#on-a)"/>
    <!-- lineage self-loop on Language -->
    <path d="M530,60 C505,20 695,20 670,60" marker-end="url(#on-a)"/>
    <!-- Language -> Papers -->
    <path d="M742,92 L894,92" marker-end="url(#on-a)"/>
    <!-- Language -> Extension (claim) -->
    <path d="M478,152 L262,262" marker-end="url(#on-a)"/>
    <!-- Content -> Extension (filename) -->
    <path d="M458,492 L262,358" marker-end="url(#on-a)"/>
    <!-- Content -> Occurrence -->
    <path d="M458,522 L306,522" marker-end="url(#on-a)"/>
    <!-- PLI method -> Attribution -->
    <path d="M898,310 L748,310" marker-end="url(#on-a)"/>
    <!-- Review -> Attribution -->
    <path d="M898,505 L748,352" marker-end="url(#on-a)"/>
  </g>
  <!-- Attribution -> Language / Content (the evidence link) -->
  <g stroke="#007a00" stroke-width="3" fill="none">
    <path d="M600,263 L600,156" marker-end="url(#on-aG)"/>
    <path d="M600,357 L600,469" marker-end="url(#on-aG)"/>
  </g>
  <!-- Language -> evidence of absence -->
  <path d="M742,128 C800,140 840,190 894,196" stroke="#c00000" stroke-width="2" stroke-dasharray="6 5" fill="none" marker-end="url(#on-aR)"/>

  <!-- ============ edge labels ============ -->
  <g font-size="14" fill="#333340">
    <text x="378" y="96" text-anchor="middle">attests · URL</text>
    <text x="600" y="22" text-anchor="middle">lineage: evolution of · dialect of · influence (HOPL)</text>
    <text x="818" y="83" text-anchor="middle">mentioned in</text>
    <text x="345" y="207" transform="rotate(-27 345 207)" text-anchor="middle">claims (source, strength)</text>
    <text x="350" y="437" transform="rotate(34.4 350 437)" text-anchor="middle">file name ends with</text>
    <text x="382" y="513" text-anchor="middle">occurs in (1 → n)</text>
    <text x="823" y="301" text-anchor="middle">produced by</text>
    <text x="830" y="425" transform="rotate(45.6 830 425)" text-anchor="middle">confirms · disputes</text>
    <text x="846" y="176" fill="#c00000">or</text>
  </g>
  <g font-size="14" fill="#007a00" font-weight="700">
    <text x="612" y="214">is written in ·</text>
    <text x="612" y="232">relates to</text>
    <text x="612" y="420">about</text>
  </g>

  <!-- ============ boxes ============ -->
  <!-- Source -->
  <rect x="30" y="60" width="270" height="90" rx="12" fill="#f4f4f8" stroke="#8c8ca6"/>
  <text x="46" y="88" fill="#111111" font-size="19" font-weight="800">Source</text>
  <text x="46" y="112" fill="#444450" font-size="14">HOPL · PLDB · Esolang · Wikidata</text>
  <text x="46" y="133" fill="#444450" font-size="14">Linguist · Pygments · LLMs · you</text>

  <!-- Language -->
  <rect x="458" y="60" width="284" height="92" rx="14" fill="#fbf3dc" stroke="#a87700" stroke-width="3"/>
  <text x="600" y="92" fill="#a87700" font-size="23" font-weight="800" text-anchor="middle">Language</text>
  <text x="600" y="117" fill="#222222" font-size="14" text-anchor="middle">identity · names · aliases</text>
  <text x="600" y="138" fill="#222222" font-size="14" text-anchor="middle">dialect of · family · qualifiers</text>

  <!-- Papers -->
  <rect x="898" y="60" width="272" height="72" rx="12" fill="#f4f4f8" stroke="#8c8ca6"/>
  <text x="914" y="88" fill="#111111" font-size="19" font-weight="800">Paper · doc</text>
  <text x="914" y="112" fill="#444450" font-size="14">traces in science (CodeCommons)</text>

  <!-- Evidence of absence -->
  <rect x="898" y="160" width="272" height="72" rx="12" fill="#f9e8e8" stroke="#c00000" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="914" y="187" fill="#c00000" font-size="18" font-weight="800">∅ Evidence of absence</text>
  <text x="914" y="211" fill="#7a2a2a" font-size="13.5">no ext · not in SWH · outcompeted · undetectable</text>

  <!-- Extension -->
  <rect x="30" y="265" width="270" height="90" rx="12" fill="#f4f4f8" stroke="#8c8ca6"/>
  <text x="46" y="293" fill="#111111" font-size="19" font-weight="800">Extension</text>
  <text x="46" y="317" fill="#444450" font-size="14">case-aware: .CBL ≠ .cbl</text>
  <text x="46" y="338" fill="#444450" font-size="14">SWH count per year</text>

  <!-- Attribution -->
  <rect x="458" y="265" width="284" height="92" rx="14" fill="#e8f3e8" stroke="#007a00" stroke-width="3"/>
  <text x="600" y="296" fill="#007a00" font-size="21" font-weight="800" text-anchor="middle">Attribution = evidence</text>
  <text x="600" y="321" fill="#222222" font-size="14" text-anchor="middle">this program ↔ this language</text>
  <text x="600" y="342" fill="#222222" font-size="14" text-anchor="middle">method · confidence · provenance</text>

  <!-- PLI method -->
  <rect x="898" y="265" width="272" height="92" rx="12" fill="#f4f4f8" stroke="#8c8ca6"/>
  <text x="914" y="293" fill="#111111" font-size="19" font-weight="800">PLI method</text>
  <text x="914" y="317" fill="#444450" font-size="14">extension · filename · shebang</text>
  <text x="914" y="338" fill="#444450" font-size="14">rule · parser · classifier · LLM</text>

  <!-- Occurrence -->
  <rect x="30" y="475" width="274" height="92" rx="12" fill="#e6eef8" stroke="#1f5fa6" stroke-width="2"/>
  <text x="46" y="503" fill="#1f5fa6" font-size="19" font-weight="800">Occurrence</text>
  <text x="46" y="527" fill="#222222" font-size="14">origin · revision · path · date</text>
  <text x="46" y="548" fill="#222222" font-size="14">→ qualified SWHID</text>

  <!-- Program (content) -->
  <rect x="458" y="473" width="284" height="94" rx="14" fill="#e6eef8" stroke="#1f5fa6" stroke-width="3"/>
  <text x="600" y="505" fill="#1f5fa6" font-size="21" font-weight="800" text-anchor="middle">Program (content)</text>
  <text x="600" y="530" fill="#222222" font-size="14" text-anchor="middle">swh:1:cnt:… = the bytes</text>
  <text x="600" y="551" fill="#222222" font-size="14" text-anchor="middle">archived · deduplicated · citable</text>

  <!-- Review -->
  <rect x="898" y="475" width="272" height="92" rx="12" fill="#f4f4f8" stroke="#8c8ca6"/>
  <text x="914" y="503" fill="#111111" font-size="19" font-weight="800">Review</text>
  <text x="914" y="527" fill="#444450" font-size="14">human · tool · LLM verdicts</text>
  <text x="914" y="548" fill="#444450" font-size="14">consensus is derived</text>

  <!-- legend -->
  <g font-size="14" fill="#555566">
    <rect x="300" y="592" width="14" height="14" rx="3" fill="#a87700"/><text x="320" y="604">knowledge about languages</text>
    <rect x="520" y="592" width="14" height="14" rx="3" fill="#007a00"/><text x="540" y="604">evidence</text>
    <rect x="630" y="592" width="14" height="14" rx="3" fill="#1f5fa6"/><text x="650" y="604">Software Heritage</text>
  </g>
</svg>
