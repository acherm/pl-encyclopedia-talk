<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="'Latin Modern Sans', 'LM Sans 10', Helvetica, Arial, sans-serif">
  <!-- UML class diagram: ProgrammingLanguage, FileExtension, Content, Occurrence, Attribution -->
  <g fill="#ffffff" stroke="#111111" stroke-width="1.6">
    <rect x="20" y="20" width="300" height="120"/>
    <rect x="580" y="20" width="300" height="120"/>
    <rect x="150" y="200" width="210" height="96"/>
    <rect x="20" y="372" width="300" height="128"/>
    <rect x="580" y="372" width="300" height="128"/>
  </g>
  <!-- compartment separators -->
  <g stroke="#111111" stroke-width="1.2">
    <line x1="20" y1="54" x2="320" y2="54"/>
    <line x1="580" y1="54" x2="880" y2="54"/>
    <line x1="150" y1="232" x2="360" y2="232"/>
    <line x1="20" y1="422" x2="320" y2="422"/>
    <line x1="580" y1="422" x2="880" y2="422"/>
  </g>

  <!-- class names -->
  <g fill="#111111" font-size="18" font-weight="700" text-anchor="middle">
    <text x="170" y="43">ProgrammingLanguage</text>
    <text x="730" y="43">FileExtension</text>
    <text x="255" y="222">Attribution</text>
    <text x="170" y="414">Program</text>
    <text x="730" y="414">Occurrence</text>
  </g>
  <g fill="#555566" font-size="13.5" text-anchor="middle">
    <text x="170" y="393">«swh:1:cnt»</text>
    <text x="730" y="393">«qualified SWHID»</text>
  </g>

  <!-- attributes -->
  <g fill="#222222" font-size="14.5">
    <text x="32" y="78">name, aliases</text>
    <text x="32" y="101">dialectOf : ProgrammingLanguage [0..1]</text>
    <text x="32" y="124">lineage [0..*]  (HOPL)</text>

    <text x="592" y="80">suffix : String  {case-sensitive}</text>
    <text x="592" y="104">countPerYear  (SWH-MSR-ARV)</text>

    <text x="162" y="255">method : PLIMethod</text>
    <text x="162" y="278">confidence · reviews [0..*]</text>

    <text x="32" y="447">sha1_git, length, bytes</text>
    <text x="32" y="472" fill="#c00000" font-style="italic">no name · no date · no repository</text>

    <text x="592" y="447">origin, revision, path</text>
    <text x="592" y="472">name → at most one extension</text>
  </g>

  <!-- associations -->
  <g stroke="#111111" stroke-width="1.6" fill="none">
    <line x1="320" y1="72" x2="580" y2="72"/>      <!-- claims -->
    <line x1="80" y1="140" x2="80" y2="372"/>      <!-- writtenIn -->
    <line x1="320" y1="436" x2="580" y2="436"/>    <!-- occursAs -->
    <line x1="730" y1="372" x2="730" y2="140"/>    <!-- hasExtension -->
  </g>
  <!-- association class link -->
  <line x1="80" y1="248" x2="150" y2="248" stroke="#111111" stroke-width="1.4" stroke-dasharray="6 4"/>

  <!-- association names -->
  <g fill="#111111" font-size="15" font-style="italic">
    <text x="450" y="63" text-anchor="middle">claims ▸</text>
    <text x="450" y="427" text-anchor="middle">occursAs ▸</text>
    <text x="66" y="318" transform="rotate(-90 66 318)" text-anchor="middle">writtenIn ▸</text>
    <text x="718" y="258" transform="rotate(-90 718 258)" text-anchor="middle">hasExtension ▸</text>
  </g>
  <text x="450" y="92" fill="#555566" font-size="13.5" text-anchor="middle">{source, strength, evidence}</text>

  <!-- multiplicities -->
  <g fill="#3333b3" font-size="15" font-weight="700">
    <text x="327" y="64">0..*</text>
    <text x="573" y="64" text-anchor="end">0..*</text>
    <text x="88" y="160">0..*</text>
    <text x="88" y="364">0..*</text>
    <text x="327" y="428">1</text>
    <text x="573" y="428" text-anchor="end">1..*</text>
    <text x="738" y="160">0..1</text>
    <text x="738" y="364">0..*</text>
  </g>


  <!-- numbered badges (explained next to the diagram) -->
  <g font-size="13" font-weight="700" text-anchor="middle">
    <circle cx="368" cy="58" r="11" fill="#3333b3"/><text x="368" y="63" fill="#fff">1</text>
    <circle cx="532" cy="58" r="11" fill="#3333b3"/><text x="532" y="63" fill="#fff">2</text>
    <circle cx="296" cy="467" r="11" fill="#3333b3"/><text x="296" y="472" fill="#fff">3</text>
    <circle cx="104" cy="318" r="11" fill="#3333b3"/><text x="104" y="323" fill="#fff">4</text>
    <circle cx="860" cy="392" r="11" fill="#3333b3"/><text x="860" y="397" fill="#fff">5</text>
  </g>
</svg>
